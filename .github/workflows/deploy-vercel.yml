name: deploy-vercel

# Builds the prerendered static site in web/ and ships it to Vercel. The
# output directory is set in web/vercel.json; the CLI reads it here.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel project
        # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from repo secrets; the
        # project must already exist in Vercel, linked to this repo.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        # Build the prerendered site with the proven npm script (TanStack
        # Start + vite) into dist/client.
        run: npm run build

      - name: Package build output
        # Assemble a Build Output API tree (.vercel/output/static) from the
        # prerendered dist/client. Deploying with --prebuilt and no path arg
        # reads this tree from cwd, which avoids the CLI's quirk of appending
        # the project root directory to a deploy path.
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r dist/client/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
