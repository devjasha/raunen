name: deploy-vercel

# Builds the prerendered static site in web/ and ships it to Vercel. The
# Vercel project's root directory is "web"; the CLI appends that to the cwd,
# so the Vercel CLI steps run from the repo root (repo_root + web = web).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-vercel.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci
      - run: cd web && npm run check

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel project
        # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from repo secrets; the
        # project must already exist in Vercel, linked to this repo.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        # Build the prerendered site with the proven npm script (TanStack
        # Start + vite) into web/dist/client.
        run: cd web && npm run build

      - name: Package build output
        # Assemble a Build Output API tree (.vercel/output/static) from the
        # prerendered web/dist/client, at the repo root where Vercel reads
        # it. Deploying with --prebuilt and no path arg ships that tree.
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -r web/dist/client/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
