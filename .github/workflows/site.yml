name: site

# The site is prerendered to static HTML, so Pages serves it with no server.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait rather than cancel: half-deployed is worse than
# a minute late.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: Build
        # Project pages are served from /<repo>/, so links and assets have to be
        # built for that prefix. A custom domain serves from the root instead —
        # set SITE_BASE to "/" here if one is configured.
        run: SITE_BASE=/${{ github.event.repository.name }}/ npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
